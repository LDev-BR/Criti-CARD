name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Public test values; jobs never use repository secrets or production data.
  SECRET_KEY: criticard-ci-only-key
  ACCOUNT_MAIL_BACKEND: disabled
  CRITICARD_BROWSER_TESTS: "0"

jobs:
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.11"
          - os: ubuntu-24.04
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test Python and SQLite
        run: python -m pytest -q --junitxml=test-results/python.xml
      - name: Save failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-${{ matrix.os }}-${{ matrix.python-version }}
          path: test-results/python.xml
          if-no-files-found: ignore
          retention-days: 7

  javascript:
    name: JavaScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install development dependencies
        run: npm ci --ignore-scripts
      - name: Test JavaScript
        run: npm test

  postgres:
    name: PostgreSQL 18
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: criticard_test
          POSTGRES_PASSWORD: criticard_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U criticard_test -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The fixture creates and drops only databases with generated UUID names.
      CRITICARD_TEST_POSTGRES_URL: postgresql+psycopg://criticard_test:criticard_test@127.0.0.1:5432/postgres
      CRITICARD_PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install PostgreSQL 18 dump and restore tools
        shell: bash
        run: |
          # Ubuntu's bundled client may be older than the service server.
          # Use the signed PostgreSQL repository documented at:
          # https://www.postgresql.org/download/linux/ubuntu/
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null <<'EOF'
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: noble-pgdg
          Architectures: amd64
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-18
          "$CRITICARD_PG_BIN/pg_dump" --version
          "$CRITICARD_PG_BIN/pg_restore" --version
          "$CRITICARD_PG_BIN/pg_dump" --version | grep -E 'PostgreSQL\) 18\.'
          "$CRITICARD_PG_BIN/pg_restore" --version | grep -E 'PostgreSQL\) 18\.'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test Python, PostgreSQL, and restore
        run: python -m pytest -q --junitxml=test-results/postgres.xml
      - name: Save failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-18
          path: test-results/postgres.xml
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Chromium browser and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CRITICARD_BROWSER_TESTS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install browser and accessibility dependencies
        run: |
          python -m pip install -r requirements-browser.txt
          npm ci --ignore-scripts
          python -m playwright install --with-deps chromium
      - name: Test browser flows and accessibility
        run: python -m pytest -q tests/test_browser_*.py tests/test_accounts_browser.py --junitxml=test-results/browser.xml
      - name: Save failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-browser
          path: test-results/browser.xml
          if-no-files-found: ignore
          retention-days: 7
