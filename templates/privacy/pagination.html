{% if listing.pages > 1 %}<nav class="privacy-pagination" aria-label="Paginação de pedidos">{% if listing.page > 1 %}<a class="button secondary" href="{{ url_for(request.endpoint, page=listing.page - 1, status=listing.status) }}">Anterior</a>{% endif %}<span>Página {{ listing.page }} de {{ listing.pages }}</span>{% if listing.page < listing.pages %}<a class="button secondary" href="{{ url_for(request.endpoint, page=listing.page + 1, status=listing.status) }}">Próxima</a>{% endif %}</nav>{% endif %}
