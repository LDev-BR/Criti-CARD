{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <ul class="flashes" aria-live="polite" data-toast-source>
            {% for category, message in messages %}
                <li class="flash {{ category }}" data-toast-message data-toast-type="{{ category }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
{% endwith %}
